services:
  web:
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
    command: sh -c "npm run db:generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run build && npm run start"
