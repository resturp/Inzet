services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inzet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inzet"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    build:
      context: ./docker/postfix
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.frii.nl}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-frii.nl}
      MAIL_ALLOWED_NETWORKS: ${MAIL_ALLOWED_NETWORKS:-127.0.0.0/8 [::1]/128 172.16.0.0/12}

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-inzet}?schema=public}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAIL_FROM: ${MAIL_FROM:-Inzet <info@frii.nl>}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:-info@frii.nl}
      MAIL_MESSAGE_ID_DOMAIN: ${MAIL_MESSAGE_ID_DOMAIN:-frii.nl}
      SENDMAIL_PATH: ${SENDMAIL_PATH:-/usr/sbin/sendmail}
      SENDMAIL_IN_DEV: ${SENDMAIL_IN_DEV:-false}
      SMTPHOST: ${SMTPHOST:-mail:25}
    command: sh -c "npm run db:generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
