services:
  db:
    image: postgres:16-alpine
    networks:
      - database
    restart: unless-stopped
    # Hardening: no privilege escalation inside the container, and nothing dropped into /tmp
    # can be executed (the September 2026 attack tried exactly that via SQL as superuser).
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inzet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/opt/inzet/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" PGCONNECT_TIMEOUT=3 psql -X -w -h db -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    build:
      context: ./docker/postfix
    restart: unless-stopped
    environment:
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.frii.nl}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-frii.nl}
      MAIL_ALLOWED_NETWORKS: ${MAIL_ALLOWED_NETWORKS:-127.0.0.0/8 [::1]/128 172.16.0.0/12}
      MAIL_RELAY_HOST: ${MAIL_RELAY_HOST:-}
      MAIL_RELAY_PORT: ${MAIL_RELAY_PORT:-465}
      MAIL_RELAY_USERNAME: ${MAIL_RELAY_USERNAME:-}
      MAIL_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}

  web:
    build: .
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      # Signs session and CSRF cookies. Empty in development falls back to a dev-only value;
      # production requires it (see docker-compose.prod.yml).
      SESSION_SECRET: ${SESSION_SECRET:-}
      CSRF_SECRET: ${CSRF_SECRET:-}
      # Every Node process (including Prisma CLI via compose exec) derives the URL.
      NODE_OPTIONS: --import=/app/scripts/database-env.mjs
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-inzet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAIL_FROM: ${MAIL_FROM:-Inzet <info@frii.nl>}
      MAIL_ENVELOPE_FROM: ${MAIL_ENVELOPE_FROM:-info@frii.nl}
      MAIL_MESSAGE_ID_DOMAIN: ${MAIL_MESSAGE_ID_DOMAIN:-frii.nl}
      SENDMAIL_PATH: ${SENDMAIL_PATH:-/usr/sbin/sendmail}
      SENDMAIL_IN_DEV: ${SENDMAIL_IN_DEV:-false}
      SMTPHOST: ${SMTPHOST:-mail:25}
    command: sh -c "npm run db:generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run dev"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

networks:
  database:
    internal: true
